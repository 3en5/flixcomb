[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flixcomb"
version = "0.1.0"
description = "Allowlist-based home content filter for Netflix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flixcomb = "flixcomb.cli:main"

[tool.setuptools.packages.find]
include = ["flixcomb*"]
